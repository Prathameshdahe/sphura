<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sphura</title>
    <meta name="description" content="Sphura — a finance assistant that reads your statements and documents, checks the markets and explains money, with sources." />
    <link rel="icon" type="image/svg+xml" href="/sphura.svg" />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <script>
      /* Apply the stored theme before first paint (next-themes key: "theme"; light unless the user picked dark/system). */
      (function () {
        try {
          var stored = null;
          try { stored = localStorage.getItem("theme"); } catch (e) {}
          var dark = stored === "dark" || (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
